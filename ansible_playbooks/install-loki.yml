---
- name: Cai dat Loki va cau hinh Grafana DataSource
  hosts: monitor
  become: yes
  tasks:
    - name: 1. Cai dat unzip
      apt:
        name: unzip
        state: present
        update_cache: yes

    - name: 2. Tai Loki v2.9.0
      get_url:
        url: "https://github.com/grafana/loki/releases/download/v2.9.0/loki-linux-amd64.zip"
        dest: "/tmp/loki-linux-amd64.zip"

    - name: 3. Giai nen Loki vao /usr/local/bin
      unarchive:
        src: "/tmp/loki-linux-amd64.zip"
        dest: "/usr/local/bin/"
        remote_src: yes

    - name: 4. Chuyen quyen thuc thi cho Loki
      file:
        path: /usr/local/bin/loki-linux-amd64
        mode: '0755'

    - name: 5. Tao thu muc cau hinh Loki
      file:
        path: /etc/loki
        state: directory

    - name: 6. Tao file cau hinh loki-config.yaml
      copy:
        dest: /etc/loki/loki-config.yaml
        content: |
          auth_enabled: false

          server:
            http_listen_port: 3100

          ingester:
            lifecycler:
              address: 127.0.0.1
              ring:
                kvstore:
                  store: inmemory
                replication_factor: 1
              final_sleep: 0s
            chunk_idle_period: 1h
            max_chunk_age: 1h
            chunk_target_size: 1048576
            chunk_retain_period: 30s

          schema_config:
            configs:
              - from: 2020-10-24
                store: boltdb-shipper
                object_store: filesystem
                schema: v11
                index:
                  prefix: index_
                  period: 24h

          storage_config:
            boltdb_shipper:
              active_index_directory: /tmp/loki/boltdb-shipper-active
              cache_location: /tmp/loki/boltdb-shipper-cache
              cache_ttl: 24h
              shared_store: filesystem
            filesystem:
              directory: /tmp/loki/chunks

          compactor:
            working_directory: /tmp/loki/boltdb-shipper-compactor
            shared_store: filesystem

          limits_config:
            reject_old_samples: true
            reject_old_samples_max_age: 168h

          chunk_store_config:
            max_look_back_period: 0s

          table_manager:
            retention_deletes_enabled: false
            retention_period: 0s

    - name: 7. Tao Systemd Service cho Loki
      copy:
        dest: /etc/systemd/system/loki.service
        content: |
          [Unit]
          Description=Loki Service
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/loki-linux-amd64 -config.file=/etc/loki/loki-config.yaml
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: 8. Khoi dong Loki Service
      systemd:
        name: loki
        state: restarted
        enabled: yes
        daemon_reload: yes

    - name: 9. Cau hinh tu dong nhan dien Loki trong Grafana (Provisioning)
      copy:
        dest: /etc/grafana/provisioning/datasources/loki.yaml
        content: |
          apiVersion: 1
          datasources:
            - name: Loki
              type: loki
              access: proxy
              url: http://localhost:3100
              isDefault: true

    - name: 10. Khoi dong lai Grafana de nhan Data Source
      systemd:
        name: grafana-server
        state: restarted

- name: Cai dat Promtail de thu thap log tren tat ca he thong
  hosts: all:localhost
  become: yes
  tasks:
    - name: 1. Cai dat unzip
      apt:
        name: unzip
        state: present
        update_cache: yes

    - name: 2. Tai Promtail v2.9.0
      get_url:
        url: "https://github.com/grafana/loki/releases/download/v2.9.0/promtail-linux-amd64.zip"
        dest: "/tmp/promtail-linux-amd64.zip"

    - name: 3. Giai nen Promtail vao /usr/local/bin
      unarchive:
        src: "/tmp/promtail-linux-amd64.zip"
        dest: "/usr/local/bin/"
        remote_src: yes

    - name: 4. Chuyen quyen thuc thi cho Promtail
      file:
        path: /usr/local/bin/promtail-linux-amd64
        mode: '0755'

    - name: 5. Tao thu muc cau hinh Promtail
      file:
        path: /etc/promtail
        state: directory

    - name: 6. Tao file cau hinh promtail-config.yaml
      copy:
        dest: /etc/promtail/promtail-config.yaml
        content: |
          server:
            http_listen_port: 9080
            grpc_listen_port: 0

          positions:
            filename: /tmp/positions.yaml

          clients:
            - url: http://10.45.10.120:3100/loki/api/v1/push

          scrape_configs:
            - job_name: syslog
              static_configs:
                - targets:
                    - localhost
                  labels:
                    job: syslog
                    host: "{{ inventory_hostname }}"
                    __path__: /var/log/syslog
            - job_name: authlog
              static_configs:
                - targets:
                    - localhost
                  labels:
                    job: authlog
                    host: "{{ inventory_hostname }}"
                    __path__: /var/log/auth.log

    - name: 7. Tao Systemd Service cho Promtail
      copy:
        dest: /etc/systemd/system/promtail.service
        content: |
          [Unit]
          Description=Promtail Service
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/promtail-linux-amd64 -config.file=/etc/promtail/promtail-config.yaml
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: 8. Khoi dong Promtail Service
      systemd:
        name: promtail
        state: restarted
        enabled: yes
        daemon_reload: yes
