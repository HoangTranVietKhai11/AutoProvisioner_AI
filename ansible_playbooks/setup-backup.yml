---
- name: Setup Database Backup Automation
  hosts: db
  become: yes
  tasks:
    - name: Create backups directory
      file:
        path: /opt/backups
        state: directory
        owner: postgres
        group: postgres
        mode: '0755'

    - name: Create backup script
      copy:
        dest: /opt/backups/backup.sh
        owner: postgres
        group: postgres
        mode: '0755'
        content: |
          #!/bin/bash
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          BACKUP_FILE="/opt/backups/db_backup_$TIMESTAMP.sql.gz"
          
          # Dump the database and compress it (Running as postgres user)
          sudo -u postgres pg_dumpall | gzip > $BACKUP_FILE
          
          # Delete backups older than 7 days to save disk space
          find /opt/backups -name "db_backup_*.sql.gz" -mtime +7 -delete

    - name: Setup Cronjob for daily backup at 2 AM
      cron:
        name: "Daily PostgreSQL Backup"
        minute: "0"
        hour: "2"
        user: postgres
        job: "/opt/backups/backup.sh"
